<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="370" viewBox="0 0 1260 370" role="img" aria-labelledby="t d"><title id="t">WildAIGC-Bench construction workflow</title><desc id="d">Event discovery, media acquisition, evidence checking, deduplication, human annotation, and versioned release. Uncertain and excluded cases remain outside the release. Provenance and decisions are recorded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8190a4"/></marker></defs><rect width="1260" height="370" rx="20" fill="#f6f7fa"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="17" fill="#344b70" font-weight="bold">EVIDENCE-DRIVEN COLLECTION · HUMAN-REVIEWED RELEASE</text><rect x="30" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="57" cy="101" r="14" fill="#e7edf5"/><text x="57" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">01</text><text x="47" y="142" font-size="17" font-weight="bold" fill="#192639">Discover events</text><text x="47" y="172" font-size="13" fill="#596579">News reports, fact checks</text><text x="47" y="193" font-size="13" fill="#596579">and social circulation</text><path d="M 217 149 H 230" stroke="#8190a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="231" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="258" cy="101" r="14" fill="#e7edf5"/><text x="258" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">02</text><text x="248" y="142" font-size="17" font-weight="bold" fill="#192639">Acquire media</text><text x="248" y="172" font-size="13" fill="#596579">Preserve acquired bytes</text><text x="248" y="193" font-size="13" fill="#596579">and source references</text><path d="M 418 149 H 431" stroke="#8190a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="459" cy="101" r="14" fill="#e7edf5"/><text x="459" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">03</text><text x="449" y="142" font-size="17" font-weight="bold" fill="#192639">Check evidence</text><text x="449" y="172" font-size="13" fill="#596579">Match image and claim</text><text x="449" y="193" font-size="13" fill="#596579">Record evidence limits</text><path d="M 619 149 H 632" stroke="#8190a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="633" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="660" cy="101" r="14" fill="#e7edf5"/><text x="660" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">04</text><text x="650" y="142" font-size="17" font-weight="bold" fill="#192639">Deduplicate</text><text x="650" y="172" font-size="13" fill="#596579">SHA256 and visual review</text><text x="650" y="193" font-size="13" fill="#596579">Group related samples</text><path d="M 820 149 H 833" stroke="#8190a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="834" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="861" cy="101" r="14" fill="#e7edf5"/><text x="861" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">05</text><text x="851" y="142" font-size="17" font-weight="bold" fill="#192639">Human annotation</text><text x="851" y="172" font-size="13" fill="#596579">AI label + inclusion review</text><text x="851" y="193" font-size="13" fill="#596579">Content / quality screening</text><path d="M 1021 149 H 1034" stroke="#8190a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="1035" y="72" width="186" height="152" rx="12" fill="white" stroke="#dce2eb"/><circle cx="1062" cy="101" r="14" fill="#e7edf5"/><text x="1062" y="106" text-anchor="middle" font-size="12" fill="#344b70" font-weight="bold">06</text><text x="1052" y="142" font-size="17" font-weight="bold" fill="#192639">Freeze v1.0</text><text x="1052" y="172" font-size="13" fill="#596579">407 accepted samples</text><text x="1052" y="193" font-size="13" fill="#596579">Raw + crop + manifest</text><path d="M 980 225 V 244 H 830 V 262" fill="none" stroke="#a5afbe" stroke-dasharray="4 4"/><rect x="555" y="262" width="440" height="36" rx="18" fill="#eef0f4"/><text x="775" y="285" text-anchor="middle" font-size="13" fill="#596579">Uncertain / excluded cases stay outside the release</text><text x="30" y="282" font-size="14" fill="#344b70" font-weight="bold">Provenance + review decisions</text><text x="30" y="334" font-size="13" fill="#596579">Record source URLs, evidence limitations, image hashes, event groups and crop coordinates. Preserve a frozen versioned manifest.</text></g></svg>